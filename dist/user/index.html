  <body class="app-starting">
    <script src="/startup.js" defer></script>
    <div class="app-shell">
      <header id="topbar">
        <a class="mobile-brand" href="#shots">探索与拍摄</a>
      </header>
      <main id="main" aria-live="polite">
        <section
          id="startup"
          class="startup"
          role="status"
          aria-live="polite"
          aria-label="正在准备校园"
        >
          <div class="startup-content">
            <div class="startup-scene" aria-hidden="true">
              <div class="startup-halo"></div>
              <svg viewBox="0 0 128 128">
                <path class="startup-frame" d="M22 39V22h17m50 0h17v17m0 50v17H89m-50 0H22V89" />
                <path
                  class="startup-camera"
                  d="M38 46h11l6-9h18l6 9h11a7 7 0 0 1 7 7v32a7 7 0 0 1-7 7H38a7 7 0 0 1-7-7V53a7 7 0 0 1 7-7Z"
                />
                <circle class="startup-lens" cx="64" cy="68" r="15" />
                <circle class="startup-light" cx="86" cy="56" r="2.5" />
              </svg>
            </div>
            <h1>探索与拍摄</h1>
            <p class="startup-tagline">下一处风景，就在身边。</p>
            <p id="startup-status" class="startup-status">准备好，一起出发。</p>
            <div class="startup-dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <button id="startup-retry" class="startup-retry" type="button" hidden>重新打开</button
            ><noscript>请启用 JavaScript 后重新打开。</noscript>
          </div>
        </section>
      </main>
    </div>
    <nav id="mobile-nav" aria-label="主要导航">

    </nav>

    <script type="module" src="/shared/liquid.js"></script>
