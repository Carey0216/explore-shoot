<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机测试入口 · 探索与拍摄</title><style>
  *{box-sizing:border-box}body{margin:0;background:#f6f6f2;color:#24332d;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:820px;margin:64px auto;padding:24px}.eyebrow{color:#687d70;font-size:13px;letter-spacing:2px}h1{margin:12px 0 8px;font-size:32px}p{color:#6c7770}.card{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:center;background:white;border:1px solid #e2e7e0;border-radius:22px;padding:30px;margin-top:28px}#qr{min-height:250px;display:grid;place-items:center}#qr svg{width:260px;height:260px;max-width:100%}#qr .empty{color:#8b948d;text-align:center}label{font-size:13px;color:#727d74}input{display:block;width:100%;margin:10px 0 16px;padding:12px;border:1px solid #dbe2dc;border-radius:8px;font-size:14px;color:#35443b;background:#fafbf8}button,a.action{display:inline-block;border:0;padding:10px 16px;border-radius:8px;background:#285f43;color:white;text-decoration:none;font-size:14px;cursor:pointer}button{background:#eef2ec;color:#285f43;margin-left:8px}.status{font-size:13px;min-height:24px}.notes{font-size:14px;margin-top:26px}small{display:block;color:#929a94;font-size:12px}#state{display:inline-block;font-size:12px;color:#285f43;background:#e9f2e7;padding:3px 10px;border-radius:20px}.off #state{color:#8a613a;background:#f6eee4}.off .actions{display:none}@media(max-width:650px){main{margin:20px auto;padding:20px}h1{font-size:27px}.card{grid-template-columns:1fr;padding:24px;gap:12px}#qr{min-height:220px}#qr svg{width:230px;height:230px}}</style></head><body><main>
  <div class="eyebrow">EXPLORE & SHOOT</div><h1>手机扫一扫，就能开始测试</h1><p>这个入口页的本机地址固定。重启隧道后，链接和二维码会自动更新。</p>
  <section class="card"><div id="qr"></div><div><span id="state"></span><p id="description"></p><label for="address">最新手机测试地址</label><input id="address" readonly aria-label="最新手机测试地址"><div class="actions"><a class="action" id="open" target="_blank" rel="noopener">打开页面</a><button id="copy" type="button">复制链接</button></div><p class="status" id="message" aria-live="polite"></p><small id="date"></small></div></section>
  <p class="notes">电脑需保持开机、联网。测试结束双击「停止HTTPS手机测试.cmd」；再次测试双击「开启HTTPS手机测试.cmd」。</p><small>聊天里的旧二维码截图不会自动更新。以后打开这个入口页，扫最新二维码即可。</small></main><script>
  let entry=__PHONE_ENTRY_JSON__;const byId=id=>document.getElementById(id);
  function render(next){entry=next;document.body.classList.toggle('off',!entry.active);byId('state').textContent=entry.active?'最新启动的入口':'测试已关闭';byId('qr').innerHTML=entry.active?entry.svg:'<div class="empty">启动 HTTPS 手机测试后<br>二维码会显示在这里</div>';byId('description').textContent=entry.active?'用手机相机或扫码工具打开此地址。':'请双击「开启HTTPS手机测试.cmd」重新开启。';byId('address').value=entry.url;byId('open').href=entry.url||'#';byId('date').textContent=entry.active?'链接生成于 '+new Date(entry.generatedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'';byId('message').textContent='';}
  byId('copy').onclick=async()=>{try{await navigator.clipboard.writeText(entry.url);byId('message').textContent='链接已复制';}catch{byId('address').select();byId('message').textContent='地址已选中，请按 Ctrl+C 复制';}};
  render(entry);setInterval(async()=>{try{const response=await fetch('./phone-test.json',{cache:'no-store'});if(!response.ok)return;const next=await response.json();if(next.active!==entry.active||next.url!==entry.url||next.generatedAt!==entry.generatedAt)render(next);}catch{byId('message').textContent='本机项目未连接，请确认项目仍在运行';}},5000);
  </script></body></html>
